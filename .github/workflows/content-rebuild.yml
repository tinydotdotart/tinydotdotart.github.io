name: Rebuild site on Sanity content change

# Rebuilds only the site (never the Studio) when Sanity content changes.
# Triggered instantly by the "rebuild-github-pages" webhook via
# repository_dispatch, or manually from the Actions tab. No secrets
# required: the dataset is public, so the content hash is computed
# without authentication.

on:
  repository_dispatch:
    types: [sanity-update]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Hash published Sanity content
        id: content
        run: |
          HASH=$(curl -s "https://k9f2u0i2.apicdn.sanity.io/v1/data/query/production?query=*%5B_type%20in%20%5B%22artwork%22%2C%22post%22%5D%5D%20%7C%20order(_id)&returnQuery=false" | jq -cS '.result' | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Compare with last deployed content
        id: diff
        run: |
          OLD=$(cat .sanity-content-hash 2>/dev/null || echo "none")
          if [ "$OLD" = "${{ steps.content.outputs.hash }}" ]; then
            echo "Content unchanged — skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Content changed — rebuilding site."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm install

      - name: Build Astro
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Upload artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.diff.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      - name: Save content hash
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "${{ steps.content.outputs.hash }}" > .sanity-content-hash
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sanity-content-hash
          git commit -m "[skip ci] update Sanity content hash"
          git push
